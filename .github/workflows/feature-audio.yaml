name: Feature tests - Audio

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/feature-audio.yaml'
      - '.github/workflows/pr-feature-suite.yaml'
      - 'tests/pr_features/pr_09/**'
      - 'tests/pr_features/pr_22/**'
      - 'tests/pr_features/pr_manifest.json'
      - 'scripts/run_pr_feature_tests.py'
      - 'scripts/pr_feature_ci.py'
      - 'scripts/tests/test_*pr_feature*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/feature-audio.yaml'
      - '.github/workflows/pr-feature-suite.yaml'
      - 'tests/pr_features/pr_09/**'
      - 'tests/pr_features/pr_22/**'
      - 'tests/pr_features/pr_manifest.json'
      - 'scripts/run_pr_feature_tests.py'
      - 'scripts/pr_feature_ci.py'
      - 'scripts/tests/test_*pr_feature*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-audio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: PR ${{ matrix.pr }} - ${{ matrix.feature }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - pr: 9
            feature: Event audio
          - pr: 22
            feature: Area music
    uses: ./.github/workflows/pr-feature-suite.yaml
    with:
      pr-number: ${{ matrix.pr }}
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
