name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test the validation harness
        run: python3 -m unittest discover --start-directory scripts/tests --verbose

      - name: Validate Unity project structure
        run: python3 scripts/validate_unity_project.py Lumenfall

  unity-edit-mode:
    name: Unity EditMode tests
    needs: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Free disk space for Unity
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" != "github-hosted" ]]; then
            echo "::error::Disk cleanup is restricted to disposable GitHub-hosted runners."
            exit 1
          fi
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          echo "Disk space after cleanup:"
          df -h /

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read Unity version
        id: unity-version
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          import os
          import sys

          project_version = Path("Lumenfall/ProjectSettings/ProjectVersion.txt").read_text(encoding="utf-8")
          matches = [line for line in project_version.splitlines() if line.startswith("m_EditorVersion:")]
          pattern = re.compile(r"m_EditorVersion:\s*(\d+\.\d+\.\d+[abfp]\d+)\s*")
          if len(matches) != 1 or (match := pattern.fullmatch(matches[0])) is None:
              print("::error::ProjectVersion.txt must contain exactly one valid m_EditorVersion.")
              sys.exit(1)

          version = match.group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"Using Unity version {version} for the test image.")

      - name: Restore Unity Library cache
        id: unity-library
        uses: actions/cache/restore@v5
        with:
          path: Lumenfall/Library
          key: unity-library-${{ runner.os }}-${{ hashFiles('Lumenfall/ProjectSettings/ProjectVersion.txt', 'Lumenfall/Packages/**') }}-${{ github.sha }}
          restore-keys: |
            unity-library-${{ runner.os }}-${{ hashFiles('Lumenfall/ProjectSettings/ProjectVersion.txt', 'Lumenfall/Packages/**') }}-
            unity-library-${{ runner.os }}-${{ hashFiles('Lumenfall/ProjectSettings/ProjectVersion.txt', 'Lumenfall/Packages/**') }}

      - name: Verify Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$UNITY_LICENSE" ]] && missing+=(UNITY_LICENSE)
          [[ -z "$UNITY_EMAIL" ]] && missing+=(UNITY_EMAIL)
          [[ -z "$UNITY_PASSWORD" ]] && missing+=(UNITY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See .github/CI.md."
            exit 1
          fi

      - name: Run Unity EditMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Lumenfall
          unityVersion: auto
          cliVersion: v0.1.72
          customImage: unityci/editor:ubuntu-${{ steps.unity-version.outputs.version }}-base-3
          testMode: editmode
          artifactsPath: artifacts/editmode
          githubToken: ''

      - name: Upload Unity test results
        if: ${{ always() && steps.unity-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: unity-editmode-results
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          if-no-files-found: warn
          retention-days: 14

      - name: Save Unity Library cache
        if: ${{ !cancelled() && steps.unity-library.outputs.cache-hit != 'true' && hashFiles('artifacts/editmode/editmode-results.xml') != '' }}
        uses: actions/cache/save@v5
        with:
          path: Lumenfall/Library
          key: ${{ steps.unity-library.outputs.cache-primary-key }}
