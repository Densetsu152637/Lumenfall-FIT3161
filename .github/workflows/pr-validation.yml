name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install and run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          release="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --silent --show-error --location "$release/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$release/actionlint_${ACTIONLINT_VERSION}_checksums.txt" --output "$RUNNER_TEMP/actionlint-checksums.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check --ignore-missing actionlint-checksums.txt)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements-validation.txt

      - name: Test the validation harness
        run: python -m unittest discover --start-directory scripts/tests --verbose

      - name: Validate Unity project structure
        run: python scripts/validate_unity_project.py Lumenfall

  content-validation:
    name: Content / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Authored runtime assets
            script: validate_authored_content.py
          - suite: Runtime world
            script: validate_runtime_world.py
          - suite: Quest and NPC dialogue
            script: validate_npc_dialogue.py
          - suite: NPC layers
            script: validate_npc_layers.py
          - suite: Garden and portals
            script: validate_garden_portals.py
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements-validation.txt

      - name: Validate authored content
        env:
          VALIDATION_SCRIPT: ${{ matrix.script }}
        run: python "scripts/$VALIDATION_SCRIPT"

  unity-tests:
    name: Unity ${{ matrix.label }} tests
    needs: [workflow-lint, repository-integrity, content-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: editmode
            label: EditMode
            assembly: Lumenfall.GameEvents.Tests
          - mode: playmode
            label: PlayMode
            assembly: Lumenfall.World.PlayModeTests
    steps:
      - name: Free disk space for Unity
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" != "github-hosted" ]]; then
            echo "::error::Disk cleanup is restricted to disposable GitHub-hosted runners."
            exit 1
          fi
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          echo "Disk space after cleanup:"
          df -h /

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Read Unity version
        id: unity-version
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          import os
          import sys

          project_version = Path("Lumenfall/ProjectSettings/ProjectVersion.txt").read_text(encoding="utf-8")
          matches = [line for line in project_version.splitlines() if line.startswith("m_EditorVersion:")]
          pattern = re.compile(r"m_EditorVersion:\s*(\d+\.\d+\.\d+[abfp]\d+)\s*")
          if len(matches) != 1 or (match := pattern.fullmatch(matches[0])) is None:
              print("::error::ProjectVersion.txt must contain exactly one valid m_EditorVersion.")
              sys.exit(1)

          version = match.group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"Using Unity version {version} for the test image.")
          PY

      - name: Verify Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$UNITY_LICENSE" ]] && missing+=(UNITY_LICENSE)
          [[ -z "$UNITY_EMAIL" ]] && missing+=(UNITY_EMAIL)
          [[ -z "$UNITY_PASSWORD" ]] && missing+=(UNITY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See .github/CI.md."
            exit 1
          fi

      - name: Restore Unity Library cache
        id: unity-library
        uses: actions/cache/restore@v5
        with:
          path: Lumenfall/Library
          key: unity-library-${{ runner.os }}-${{ matrix.mode }}-${{ hashFiles('Lumenfall/ProjectSettings/ProjectVersion.txt', 'Lumenfall/Packages/**') }}-${{ github.sha }}
          restore-keys: |
            unity-library-${{ runner.os }}-${{ matrix.mode }}-${{ hashFiles('Lumenfall/ProjectSettings/ProjectVersion.txt', 'Lumenfall/Packages/**') }}-

      - name: Run first-party Unity tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Lumenfall
          unityVersion: auto
          customImage: unityci/editor:ubuntu-${{ steps.unity-version.outputs.version }}-base-3
          testMode: ${{ matrix.mode }}
          customParameters: -assemblyNames ${{ matrix.assembly }}
          coverageEnabled: false
          githubToken: ''
          artifactsPath: artifacts/${{ matrix.mode }}

      - name: Require passing results from the intended suite
        if: ${{ always() && steps.unity-tests.outcome != 'skipped' && steps.unity-tests.outcome != '' }}
        env:
          TEST_MODE: ${{ matrix.mode }}
          TEST_ASSEMBLY: ${{ matrix.assembly }}
        run: python scripts/validate_unity_results.py "artifacts/$TEST_MODE" --assembly "$TEST_ASSEMBLY" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload Unity test results and logs
        if: ${{ always() && steps.unity-tests.outcome != 'skipped' && steps.unity-tests.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: unity-${{ matrix.mode }}-results
          path: artifacts/${{ matrix.mode }}
          if-no-files-found: warn
          retention-days: 14

      - name: Save Unity Library cache
        if: ${{ !cancelled() && steps.unity-library.outputs.cache-hit != 'true' && steps.unity-tests.outcome != 'skipped' && steps.unity-tests.outcome != '' && hashFiles('artifacts/**/*-results.xml') != '' }}
        uses: actions/cache/save@v5
        with:
          path: Lumenfall/Library
          key: ${{ steps.unity-library.outputs.cache-primary-key }}
