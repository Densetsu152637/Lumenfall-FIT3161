name: Feature PR 02 - Content validators

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/feature-pr-02-content-validators.yaml'
      - '.github/workflows/pr-feature-suite.yaml'
      - 'tests/pr_features/pr_02/**'
      - 'tests/pr_features/pr_manifest.json'
      - 'scripts/run_pr_feature_tests.py'
      - 'scripts/pr_feature_ci.py'
      - 'scripts/tests/test_*pr_feature*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/feature-pr-02-content-validators.yaml'
      - '.github/workflows/pr-feature-suite.yaml'
      - 'tests/pr_features/pr_02/**'
      - 'tests/pr_features/pr_manifest.json'
      - 'scripts/run_pr_feature_tests.py'
      - 'scripts/pr_feature_ci.py'
      - 'scripts/tests/test_*pr_feature*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-pr-02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Content validators
    uses: ./.github/workflows/pr-feature-suite.yaml
    with:
      pr-number: 2
