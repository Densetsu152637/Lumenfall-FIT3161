name: Build test game bundle

on:
  push:
    branches: [CI/build-test]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Validate release sources
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test repository and bundle tooling
        run: python3 -m unittest discover --start-directory scripts/tests --verbose

      - name: Validate Unity project structure
        run: python3 scripts/validate_unity_project.py Lumenfall

  build-windows:
    name: Build Windows x64 player
    needs: repository-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Verify Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$UNITY_LICENSE" ]] && missing+=(UNITY_LICENSE)
          [[ -z "$UNITY_EMAIL" ]] && missing+=(UNITY_EMAIL)
          [[ -z "$UNITY_PASSWORD" ]] && missing+=(UNITY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See .github/CI.md."
            exit 1
          fi

      - name: Check out release sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false

      - name: Free disk space for Unity
        timeout-minutes: 6
        run: python3 scripts/free_unity_disk_space.py

      - name: Verify materialized build assets
        run: python3 scripts/validate_unity_project.py Lumenfall --require-lfs-assets

      - name: Restore Windows Unity Library cache
        id: unity-library
        uses: actions/cache/restore@v5
        with:
          path: Lumenfall/Library
          key: unity-release-windows-${{ runner.os }}-${{ hashFiles('Lumenfall/ProjectSettings/ProjectVersion.txt', 'Lumenfall/Packages/**') }}-${{ hashFiles('Lumenfall/ProjectSettings/**') }}-${{ hashFiles('Lumenfall/Assets/**') }}
          restore-keys: |
            unity-release-windows-${{ runner.os }}-${{ hashFiles('Lumenfall/ProjectSettings/ProjectVersion.txt', 'Lumenfall/Packages/**') }}-${{ hashFiles('Lumenfall/ProjectSettings/**') }}-
            unity-release-windows-${{ runner.os }}-${{ hashFiles('Lumenfall/ProjectSettings/ProjectVersion.txt', 'Lumenfall/Packages/**') }}-

      - name: Build game
        id: unity-build
        # v5.0.1 is pinned to its Node 24-capable upstream release commit.
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Lumenfall
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildName: Lumenfall
          buildsPath: build
          versioning: None

      - name: Bundle player and calculate checksum
        id: package-player
        shell: bash
        env:
          BUNDLE_VERSION: build-test-${{ github.run_id }}
        run: |
          python3 scripts/package_game.py build/StandaloneWindows64 dist \
            --version "$BUNDLE_VERSION" --commit "$(git rev-parse HEAD)"

      - name: Save Windows Unity Library cache
        if: ${{ !cancelled() && steps.package-player.outcome == 'success' && steps.unity-library.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: Lumenfall/Library
          key: ${{ steps.unity-library.outputs.cache-primary-key }}

      - name: Upload downloadable bundle
        uses: actions/upload-artifact@v7
        with:
          name: Lumenfall-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: ${{ always() && steps.unity-build.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: unity-windows-build-logs
          path: |
            build/**/*.log
            Lumenfall/Logs/**
            Lumenfall/Temp/graphics-settings-stripping.json
            Lumenfall/Temp/shader-stripping.json
          if-no-files-found: warn
          retention-days: 14

  fresh-import-audit:
    name: Fresh Unity asset import audit
    if: ${{ contains(github.event.head_commit.message, '[fresh-import-audit]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Verify Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$UNITY_LICENSE" ]] && missing+=(UNITY_LICENSE)
          [[ -z "$UNITY_EMAIL" ]] && missing+=(UNITY_EMAIL)
          [[ -z "$UNITY_PASSWORD" ]] && missing+=(UNITY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See .github/CI.md."
            exit 1
          fi

      - name: Check out release sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false

      - name: Free disk space for Unity
        timeout-minutes: 6
        run: python3 scripts/free_unity_disk_space.py

      - name: Validate materialized build assets
        run: python3 scripts/validate_unity_project.py Lumenfall --require-lfs-assets

      - name: Read Unity version and verify fresh artifacts
        id: unity-version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          lines = [line for line in Path("Lumenfall/ProjectSettings/ProjectVersion.txt").read_text(encoding="utf-8").splitlines()
                   if line.startswith("m_EditorVersion:")]
          match = re.fullmatch(r"m_EditorVersion:\s*(\d+\.\d+\.\d+[abfp]\d+)\s*", lines[0]) if len(lines) == 1 else None
          if match is None:
              print("::error::ProjectVersion.txt must contain exactly one valid m_EditorVersion.")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={match.group(1)}\n")
          PY
          echo "runner-owner=$(id -u):$(id -g)" >> "$GITHUB_OUTPUT"
          if [[ -e Lumenfall/Library || -L Lumenfall/Library ]]; then
            echo "::error::Lumenfall/Library already exists; refusing to claim a cold import."
            exit 1
          fi
          if [[ -e artifacts/fresh-import-audit || -L artifacts/fresh-import-audit ]]; then
            echo "::error::Fresh import artifact directory already exists; refusing stale results."
            exit 1
          fi

      - name: Run asset import fixture on a cold Library
        id: unity-tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Lumenfall
          unityVersion: auto
          cliVersion: v0.1.72
          chownFilesTo: ${{ steps.unity-version.outputs.runner-owner }}
          customImage: unityci/editor:ubuntu-${{ steps.unity-version.outputs.version }}-windows-mono-3
          testMode: editmode
          customParameters: -buildTarget win64 -testFilter Lumenfall.Tests.GameEvents.SerializedAssetImportTests
          artifactsPath: artifacts/fresh-import-audit
          githubToken: ""

      - name: Verify fresh import fixture and diagnostics
        id: verify-fresh-import
        if: ${{ always() && steps.unity-tests.outcome != 'skipped' }}
        env:
          UNITY_OUTCOME: ${{ steps.unity-tests.outcome }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 scripts/verify_fresh_import.py \
            --artifacts artifacts/fresh-import-audit \
            --outcome "$UNITY_OUTCOME" --expected-revision "$EXPECTED_REVISION"

      - name: Upload fresh import results and diagnostics
        if: ${{ always() && steps.unity-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: fresh-import-audit
          path: |
            artifacts/fresh-import-audit/
            Lumenfall/Logs/**
          if-no-files-found: warn
          retention-days: 14
