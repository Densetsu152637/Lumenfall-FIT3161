name: Feature acceptance tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/feature-*.yaml'
      - '.github/workflows/pr-feature-suite.yaml'
      - 'tests/pr_features/pr_*/**'
      - 'tests/pr_features/pr_manifest.json'
      - 'scripts/run_pr_feature_tests.py'
      - 'scripts/pr_feature_ci.py'
      - 'scripts/select_pr_checks.py'
      - 'scripts/select_pr_feature_suites.py'
      - 'scripts/free_unity_disk_space.py'
      - 'scripts/tests/test_select_pr_checks.py'
      - 'scripts/tests/test_free_unity_disk_space.py'
      - 'scripts/tests/test_*pr_feature*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/feature-*.yaml'
      - '.github/workflows/pr-feature-suite.yaml'
      - 'tests/pr_features/pr_*/**'
      - 'tests/pr_features/pr_manifest.json'
      - 'scripts/run_pr_feature_tests.py'
      - 'scripts/pr_feature_ci.py'
      - 'scripts/select_pr_checks.py'
      - 'scripts/select_pr_feature_suites.py'
      - 'scripts/free_unity_disk_space.py'
      - 'scripts/tests/test_select_pr_checks.py'
      - 'scripts/tests/test_free_unity_disk_space.py'
      - 'scripts/tests/test_*pr_feature*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Select affected suites
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      has_suites: ${{ steps.selection.outputs.has_suites }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          sparse-checkout: scripts
          persist-credentials: false
      - name: Select catalog suites
        id: selection
        run: python3 scripts/select_pr_feature_suites.py --group all

  suites:
    name: PR ${{ matrix.pr }} - ${{ matrix.feature }}
    needs: select
    if: ${{ needs.select.outputs.has_suites == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    uses: ./.github/workflows/pr-feature-suite.yaml
    with:
      pr-number: ${{ matrix.pr }}
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
