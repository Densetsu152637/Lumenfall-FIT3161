name: Feature PR 01 - Hint feedback and reset

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/feature-pr-01-hint-feedback-reset.yaml'
      - '.github/workflows/pr-feature-suite.yaml'
      - 'tests/pr_features/pr_01/**'
      - 'tests/pr_features/pr_manifest.json'
      - 'scripts/run_pr_feature_tests.py'
      - 'scripts/pr_feature_ci.py'
      - 'scripts/tests/test_*pr_feature*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/feature-pr-01-hint-feedback-reset.yaml'
      - '.github/workflows/pr-feature-suite.yaml'
      - 'tests/pr_features/pr_01/**'
      - 'tests/pr_features/pr_manifest.json'
      - 'scripts/run_pr_feature_tests.py'
      - 'scripts/pr_feature_ci.py'
      - 'scripts/tests/test_*pr_feature*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-pr-01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Hint feedback and reset
    uses: ./.github/workflows/pr-feature-suite.yaml
    with:
      pr-number: 1
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
