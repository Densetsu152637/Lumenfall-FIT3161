name: Feature tests - Presentation and UI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/feature-presentation-ui.yaml'
      - '.github/workflows/pr-feature-suite.yaml'
      - 'tests/pr_features/pr_11/**'
      - 'tests/pr_features/pr_13/**'
      - 'tests/pr_features/pr_15/**'
      - 'tests/pr_features/pr_18/**'
      - 'tests/pr_features/pr_23/**'
      - 'tests/pr_features/pr_manifest.json'
      - 'scripts/run_pr_feature_tests.py'
      - 'scripts/pr_feature_ci.py'
      - 'scripts/tests/test_*pr_feature*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/feature-presentation-ui.yaml'
      - '.github/workflows/pr-feature-suite.yaml'
      - 'tests/pr_features/pr_11/**'
      - 'tests/pr_features/pr_13/**'
      - 'tests/pr_features/pr_15/**'
      - 'tests/pr_features/pr_18/**'
      - 'tests/pr_features/pr_23/**'
      - 'tests/pr_features/pr_manifest.json'
      - 'scripts/run_pr_feature_tests.py'
      - 'scripts/pr_feature_ci.py'
      - 'scripts/tests/test_*pr_feature*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-presentation-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: PR ${{ matrix.pr }} - ${{ matrix.feature }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - pr: 11
            feature: Accessibility and localization
          - pr: 13
            feature: World presentation
          - pr: 15
            feature: Production UI
          - pr: 18
            feature: Camera
          - pr: 23
            feature: Graphics defaults
    uses: ./.github/workflows/pr-feature-suite.yaml
    with:
      pr-number: ${{ matrix.pr }}
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
