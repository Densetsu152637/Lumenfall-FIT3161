name: PR feature suite runner

on:
  workflow_call:
    inputs:
      pr-number:
        description: PR number in the pinned feature manifest
        required: true
        type: number
    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  acceptance:
    name: PR ${{ inputs.pr-number }} acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_NUMBER: ${{ inputs.pr-number }}
    steps:
      - name: Check out acceptance catalog
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Identify pinned suite
        id: suite
        run: python scripts/pr_feature_ci.py describe --pr "$PR_NUMBER"

      - name: Fetch exact target revision
        env:
          TARGET_COMMIT: ${{ steps.suite.outputs.commit }}
        run: git fetch --no-tags --depth=1 origin "$TARGET_COMMIT"

      - name: Prepare isolated target and acceptance tests
        id: prepare
        run: python scripts/pr_feature_ci.py prepare --pr "$PR_NUMBER"

      - name: Run Python mutation tests
        id: python-tests
        if: ${{ steps.prepare.outputs.python == 'true' }}
        run: python scripts/run_pr_feature_tests.py --pr "$PR_NUMBER" --mode python

      - name: Free disk space for Unity
        if: ${{ steps.prepare.outputs.unity == 'true' }}
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" != "github-hosted" ]]; then
            echo "::error::Disk cleanup is restricted to disposable GitHub-hosted runners."
            exit 1
          fi
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - name: Restore target Unity Library
        id: unity-library
        if: ${{ steps.prepare.outputs.unity == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.prepare.outputs.project }}/Library
          key: feature-pr-${{ inputs.pr-number }}-${{ runner.os }}-${{ steps.prepare.outputs.unity-version }}-${{ steps.prepare.outputs.commit }}-${{ steps.prepare.outputs.suite-hash }}
          restore-keys: |
            feature-pr-${{ inputs.pr-number }}-${{ runner.os }}-${{ steps.prepare.outputs.unity-version }}-${{ steps.prepare.outputs.commit }}-

      - name: Verify Unity license secrets
        id: license
        if: ${{ steps.prepare.outputs.unity == 'true' }}
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$UNITY_LICENSE" ]] && missing+=(UNITY_LICENSE)
          [[ -z "$UNITY_EMAIL" ]] && missing+=(UNITY_EMAIL)
          [[ -z "$UNITY_PASSWORD" ]] && missing+=(UNITY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See .github/CI.md."
            exit 1
          fi

      - name: Run EditMode acceptance tests
        id: editmode
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.license.outcome == 'success' && steps.prepare.outputs.editmode == 'true' }}
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ steps.prepare.outputs.project }}
          unityVersion: auto
          customImage: unityci/editor:ubuntu-${{ steps.prepare.outputs.unity-version }}-base-3
          testMode: editmode
          customParameters: -testFilter Lumenfall.FeatureAcceptance
          artifactsPath: artifacts/pr-${{ inputs.pr-number }}/editmode
          githubToken: ''

      - name: Run PlayMode acceptance tests
        id: playmode
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.license.outcome == 'success' && steps.prepare.outputs.playmode == 'true' }}
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ steps.prepare.outputs.project }}
          unityVersion: auto
          customImage: unityci/editor:ubuntu-${{ steps.prepare.outputs.unity-version }}-base-3
          testMode: playmode
          customParameters: -testFilter Lumenfall.FeatureAcceptance
          artifactsPath: artifacts/pr-${{ inputs.pr-number }}/playmode
          githubToken: ''

      - name: Verify complete discovery and summarize suite
        id: verify
        if: ${{ !cancelled() && steps.suite.outcome == 'success' }}
        env:
          EDITMODE_OUTCOME: ${{ steps.editmode.outcome }}
          PLAYMODE_OUTCOME: ${{ steps.playmode.outcome }}
          PYTHON_OUTCOME: ${{ steps.python-tests.outcome }}
        run: |
          python scripts/pr_feature_ci.py verify --pr "$PR_NUMBER" \
            --editmode-outcome "$EDITMODE_OUTCOME" \
            --playmode-outcome "$PLAYMODE_OUTCOME" \
            --python-outcome "$PYTHON_OUTCOME"

      - name: Upload suite results and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ inputs.pr-number }}-feature-acceptance
          path: |
            artifacts/pr-${{ inputs.pr-number }}/
            Temp/pr-tests/pr_*/report*.json
            Temp/pr-tests/pr_*/ci-report.json
            Temp/pr-tests/pr_*/python.log
            Temp/pr-tests/pr_*/snapshot.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save validated Unity Library
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.prepare.outputs.unity == 'true' && steps.unity-library.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.prepare.outputs.project }}/Library
          key: ${{ steps.unity-library.outputs.cache-primary-key }}
